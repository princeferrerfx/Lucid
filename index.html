<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Dashboard Lucid</title>
<style>
:root{--bg:#0b0b0d;--card:#141417;--cell:#1a1a1e;--bd:#26262b;--tx:#f2f2f3;--mu:#8b8b93;--g:#3ddc97;--gb:rgba(61,220,151,.12);--r:#f0706f;--rb:rgba(240,112,111,.12);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f5f7;--card:#fff;--cell:#f0f0f3;--bd:#e0e0e6;--tx:#17171a;--mu:#6b6b75;--g:#0f9d63;--gb:rgba(15,157,99,.1);--r:#d6403f;--rb:rgba(214,64,63,.09);color-scheme:light}}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%}
.w{max-width:1100px;margin:0 auto;padding:18px}
h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px}
button,select,input{font:inherit;color:inherit}
.seg button{background:none;border:0;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--cell);color:var(--tx);font-weight:600}
.btn{background:var(--cell);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.g{background:var(--gb);border-color:var(--g);color:var(--g)}
.btn.sm{padding:4px 9px;font-size:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--cell);margin-left:6px;vertical-align:middle}
.tag.a{background:var(--gb);color:var(--g)}.tag.b{background:var(--rb);color:var(--r)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.s{background:var(--cell);border-radius:10px;padding:10px 12px}
.s small{display:block;color:var(--mu);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.s b{font-size:17px}
.g{color:var(--g)}.r{color:var(--r)}
.prog{height:6px;background:var(--cell);border-radius:4px;margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--mu);font-size:11px;padding:4px}
.d{min-height:64px;background:var(--cell);border:1px solid transparent;border-radius:8px;padding:5px 6px;cursor:pointer;font-size:12px}
.d.e{background:none;cursor:default}
.d.w{background:var(--gb);border-color:rgba(61,220,151,.35)}.d.l{background:var(--rb);border-color:rgba(240,112,111,.35)}
.d.sel{outline:2px solid var(--tx)}
.d b{display:block;font-size:13px;margin-top:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px}
input,select{background:var(--cell);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
.f{flex:1;min-width:110px}
.two{display:grid;gap:14px;grid-template-columns:1.6fr 1fr;margin-top:14px}
@media(max-width:800px){.two{grid-template-columns:1fr}.d{min-height:52px;font-size:10.5px}.d b{font-size:11px}}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:11px;font-weight:500}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.note{font-size:12px;color:var(--mu);margin-top:8px}.hid{display:none}textarea{width:100%;min-height:70px;background:var(--cell);border:1px solid var(--bd);border-radius:8px;color:inherit;padding:8px;font:12px monospace}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var PRE={25:{mll:1000,minDay:100,cap:1000,target:1250},50:{mll:2000,minDay:150,cap:2000,target:3000},100:{mll:3000,minDay:200,cap:2500,target:6000},150:{mll:4500,minDay:250,cap:3000,target:9000}};
var S={accts:[],sel:null,filter:'active',type:'all',month:new Date(),day:null,msg:''};
try{var raw=localStorage.getItem('lucid-dash');if(raw){var p=JSON.parse(raw);S.accts=p.accts||[];}}catch(e){}
function save(){try{localStorage.setItem('lucid-dash',JSON.stringify({accts:S.accts}))}catch(e){}cloudSave()}
function mk(name,no,k,type){var p=PRE[k];return{type:type||'funded',target:p.target,cons:50,evalDays:2,id:'a'+Date.now()+Math.random().toString(36).slice(2,5),name:name||('LucidFlex '+k+'K'),no:no||'',k:k,start:k*1000,mll:p.mll,minDay:p.minDay,days:5,cap:p.cap,pct:50,entries:{},payouts:[]}}
if(!S.accts.length){S.accts.push(mk('LucidFlex 25K','',25))}
var $=function(s){return document.querySelector(s)};
function $$(n){return n}
function fmt(n){return(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function calc(a){
 var ds={},k;for(k in a.entries)ds[k]=1;a.payouts.forEach(function(p){ds[p.date]=1});
 var dates=Object.keys(ds).sort(),bal=a.start,peak=a.start,pts=[],breach=false,floor=Math.min(a.start+100,a.start-a.mll);
 dates.forEach(function(d){bal+=(a.entries[d]||0);peak=Math.max(peak,bal);floor=Math.min(a.start+100,peak-a.mll);
  if(bal<=floor)breach=true;
  a.payouts.forEach(function(p){if(p.date===d)bal-=p.amount});
  pts.push({d:d,bal:bal,floor:floor})});
 var last=a.payouts.reduce(function(m,p){return p.date>m?p.date:m},'');
 var cd=0,win=0,loss=0,wd=0,mx=0;
 for(k in a.entries){var v=a.entries[k];if(v>mx)mx=v;if(v>0){win+=v;wd++}else loss+=v;if(k>last&&v>=a.minDay)cd++}
 var profit=bal-a.start,avail=0,tgt=a.target||PRE[a.k].target,cons=a.cons||50,ed=a.evalDays||2,cp=profit>0?mx/profit*100:0,passed=!breach&&profit>=tgt&&Object.keys(a.entries).length>=ed&&cp<=cons;
 if(!breach&&cd>=a.days&&profit>0)avail=Math.min(a.cap,Math.floor(profit*a.pct/100));
 var paid=a.payouts.reduce(function(s,p){return s+p.amount},0);
 return{bal:bal,floor:floor,pts:pts,breach:breach,cd:cd,win:win,loss:loss,wd:wd,profit:profit,avail:avail,paid:paid,n:Object.keys(a.entries).length,tgt:tgt,cons:cons,ed:ed,cp:cp,passed:passed}}
function cur(){return S.accts.filter(function(a){return a.id===S.sel})[0]}
function card(a){var c=calc(a);
 return '<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">'+esc(a.name)+'<span class="tag">'+(a.type==='eval'?'EVAL':'FUNDED')+'</span><span class="tag '+(c.breach?'b':'a')+'">'+(c.breach?'Breached':'Active')+'</span></h2><div class="sub">'+esc(a.no||'sin número')+' · '+a.k+'K</div></div></div>'+
 '<div class="st"><div class="s"><small>Balance / Mínimo</small><b>'+fmt(c.bal)+'</b> <span class="sub">/ '+fmt(c.floor)+'</span></div><div class="s"><small>Profit</small><b class="'+(c.profit>=0?'g':'r')+'">'+fmt(c.profit)+'</b></div>'+cells(a,c)+'</div>'+
 '<button class="btn" style="width:100%" onclick="openA(\''+a.id+'\')">Ver detalles</button></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sc(l,v){return '<div class="s"><small>'+l+'</small>'+v+'</div>'}
function cells(a,c){if(a.type==='eval')return sc('Meta profit','<b>'+fmt(c.tgt)+'</b>')+sc('Consistencia','<b class="'+(c.cp<=c.cons?'g':'r')+'">'+Math.round(c.cp)+'%</b> <span class="sub">/ '+c.cons+'%</span>')+sc('Días','<b>'+c.n+'</b> <span class="sub">/ '+c.ed+'</span>');return sc('Min profit diario','<b>'+fmt(a.minDay)+'</b>')+sc('Días profit','<b class="'+(c.cd>=a.days?'g':'r')+'">'+c.cd+'</b> <span class="sub">/ '+a.days+'</span>')+sc('Disponible retiro','<b class="'+(c.avail?'g':'')+'">'+fmt(c.avail)+'</b>')}
function evalPanel(a,c){var pg=Math.max(0,Math.min(100,c.profit/c.tgt*100));return '<div class="st"><div class="s"><small>Progreso a la meta</small><b>'+fmt(c.profit)+'</b> <span class="sub">/ '+fmt(c.tgt)+'</span><div class="prog"><i style="width:'+pg+'%"></i></div></div>'+sc('Consistencia (mayor día / profit)','<b class="'+(c.cp<=c.cons?'g':'r')+'">'+Math.round(c.cp)+'%</b> <span class="sub">máx '+c.cons+'%</span>')+sc('Días de trading','<b class="'+(c.n>=c.ed?'g':'r')+'">'+c.n+'</b> <span class="sub">/ mín '+c.ed+'</span>')+sc('Estado',c.passed?'<b class="g">¡Aprobada!</b>':c.breach?'<b class="r">Breached</b>':'<b>En curso</b>')+'</div>'+(c.passed?'<button class="btn g" style="width:100%;margin-bottom:14px" onclick="toFunded()">Pasar a cuenta fondeada (crea una nueva)</button>':'')}
function toFunded(){var a=cur(),n=mk('LucidFlex '+a.k+'K','',a.k,'funded');S.accts.push(n);S.sel=n.id;save();render()}
function backup(){return '<div class="card" style="margin-top:14px"><h2>Respaldo de datos</h2><textarea id="bk" placeholder="Aquí aparece tu respaldo. Para restaurar, pega aquí el texto y toca Importar."></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="exportB()">Exportar (copiar)</button><button class="btn" onclick="importB()">Importar</button><span class="sub" id="bm"></span></div><div class="note">Guarda el texto exportado en tus notas. Importar reemplaza todas las cuentas actuales.</div></div>'}
function exportB(){var t=JSON.stringify({accts:S.accts}),b=$('#bk');b.value=t;b.select();var ok=false;try{navigator.clipboard.writeText(t);ok=true}catch(e){}$('#bm').textContent=ok?'Copiado al portapapeles':'Selecciona y copia el texto'}
function importB(){try{var p=JSON.parse($('#bk').value);if(!Array.isArray(p.accts)||!p.accts.length)throw 0;S.accts=p.accts;S.sel=null;save();render()}catch(e){$('#bm').textContent='Texto de respaldo no válido'}}
function openA(id){S.sel=id;S.day=null;S.month=new Date();render()}
function setF(f){S.filter=f;render()}
function addAcct(){var n=$('#nn').value,no=$('#nm').value,k=+$('#nk').value;var a=mk(n,no,k,$('#nt').value);S.accts.push(a);save();S.sel=a.id;render()}
function delAcct(){if(!confirm('¿Eliminar esta cuenta y todo su historial?'))return;S.accts=S.accts.filter(function(a){return a.id!==S.sel});if(!S.accts.length)S.accts.push(mk('',"",25));S.sel=null;save();render()}
function home(){var list=S.accts.filter(function(a){var b=calc(a).breach;return (S.type==='all'||(a.type||'funded')===S.type)&&(S.filter==='all'||(S.filter==='active'?!b:b))});
 var t=0,av=0;S.accts.forEach(function(a){var c=calc(a);t+=c.profit;av+=c.avail});
 return '<h1>Account Summary</h1><div class="sub">Administra y monitorea tus cuentas de fondeo</div>'+
 '<div class="st"><div class="s"><small>Cuentas</small><b>'+S.accts.length+'</b></div><div class="s"><small>Profit total</small><b class="'+(t>=0?'g':'r')+'">'+fmt(t)+'</b></div><div class="s"><small>Disponible para retirar</small><b class="g">'+fmt(av)+'</b></div></div>'+
 '<div class="bar"><div class="seg">'+[['eval','Eval'],['funded','Funded'],['all','All']].map(function(x){return '<button class="'+(S.type===x[0]?'on':'')+'" onclick="S.type=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div><div class="seg">'+[['active','Active'],['breached','Breached'],['all','All']].map(function(x){return '<button class="'+(S.filter===x[0]?'on':'')+'" onclick="setF(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div></div>'+
 '<div class="grid">'+(list.map(card).join('')||'<div class="sub">No hay cuentas en este filtro.</div>')+'</div>'+
 '<div class="card" style="margin-top:14px"><h2>Agregar cuenta</h2><div class="row"><div class="f" style="flex:2"><label>Nombre</label><input id="nn" placeholder="LucidFlex 25K"></div><div class="f" style="flex:2"><label>Número de cuenta</label><input id="nm" placeholder="LFF150..."></div><div class="f"><label>Tipo</label><select id="nt"><option value="eval">Eval</option><option value="funded">Funded</option></select></div><div class="f"><label>Tamaño</label><select id="nk"><option value="25">25K</option><option value="50">50K</option><option value="100">100K</option><option value="150">150K</option></select></div><button class="btn g" onclick="addAcct()">Agregar</button></div></div>'+backup()}
function chart(a,c){var P=c.pts;if(P.length<1)return '<div class="sub" style="padding:30px 0">Registra tu primer día para ver la gráfica.</div>';
 var pts=[{d:'Inicio',bal:a.start,floor:a.start-a.mll}].concat(P),W=700,H=220,m=50,all=[];pts.forEach(function(p){all.push(p.bal,p.floor)});
 var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pd=(hi-lo)*.1||100;lo-=pd;hi+=pd;
 function X(i){return m+(pts.length>1?i*(W-m-10)/(pts.length-1):0)}function Y(v){return 10+(hi-v)*(H-30)/(hi-lo)}
 var L=function(k){return pts.map(function(p,i){return X(i)+','+Y(p[k])}).join(' ')};
 var grid='';for(var i=0;i<4;i++){var v=lo+(hi-lo)*i/3;grid+='<line x1="'+m+'" x2="'+W+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="4" y="'+(Y(v)+4)+'" fill="var(--mu)" font-size="10">'+fmt(Math.round(v))+'</text>'}
 var lbl=pts.length>1?'<text x="'+X(1)+'" y="'+(H-2)+'" fill="var(--mu)" font-size="10">'+pts[1].d.slice(5)+'</text><text x="'+(W-40)+'" y="'+(H-2)+'" fill="var(--mu)" font-size="10">'+pts[pts.length-1].d.slice(5)+'</text>':'';
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+grid+'<polygon points="'+X(0)+','+Y(lo)+' '+L('bal')+' '+X(pts.length-1)+','+Y(lo)+'" fill="var(--gb)"/><polyline points="'+L('bal')+'" fill="none" stroke="var(--g)" stroke-width="2"/><polyline points="'+L('floor')+'" fill="none" stroke="var(--r)" stroke-dasharray="4 3" stroke-width="1.5"/>'+lbl+'</svg><div class="sub"><span class="g">●</span> Balance &nbsp; <span class="r">●</span> Mínimo (límite de pérdida)</div>'}
function cal(a){var y=S.month.getFullYear(),mo=S.month.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),h='';
 ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(function(d){h+='<div class="h">'+d+'</div>'});
 for(var i=0;i<first;i++)h+='<div class="d e"></div>';
 for(var d=1;d<=n;d++){var k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),v=a.entries[k],cl=v===undefined?'':(v>=0?' w':' l');
  h+='<div class="d'+cl+(S.day===k?' sel':'')+'" onclick="pickD(\''+k+'\')">'+d+(v===undefined?'':'<b class="'+(v>=0?'g':'r')+'">'+fmt(v)+'</b>')+'</div>'}
 var mn=S.month.toLocaleDateString('es',{month:'long',year:'numeric'});
 return '<div class="nav"><h2 style="margin:0">Trading Calendar</h2><div class="row" style="align-items:center"><button class="btn sm" onclick="mv(-1)">←</button><b style="min-width:120px;text-align:center;text-transform:capitalize">'+mn+'</b><button class="btn sm" onclick="mv(1)">→</button></div></div><div class="cal">'+h+'</div>'}
function mv(n){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+n,1);render()}
function pickD(k){S.day=k;var a=cur();render();$('#ed').value=k;if(a.entries[k]!==undefined)$('#ep').value=a.entries[k]}
function setE(){var a=cur(),d=$('#ed').value,v=parseFloat($('#ep').value);if(!d||isNaN(v))return;a.entries[d]=v;S.day=d;save();render()}
function delE(d){delete cur().entries[d];save();render()}
function payout(){var a=cur(),v=parseFloat($('#pa').value),d=$('#pd').value||today();if(isNaN(v)||v<=0)return;a.payouts.push({date:d,amount:v});save();render()}
function delP(i){cur().payouts.splice(i,1);save();render()}
function setR(f,v){var a=cur();a[f]=f==='name'||f==='no'?v:(parseFloat(v)||0);save();render()}
function setK(k){var a=cur(),p=PRE[k];a.k=+k;a.start=k*1000;a.mll=p.mll;a.minDay=p.minDay;a.cap=p.cap;a.target=p.target;save();render()}
function inp(l,f,v,t){return '<div class="f"><label>'+l+'</label><input type="'+(t||'number')+'" value="'+esc(v)+'" onchange="setR(\''+f+'\',this.value)"></div>'}
function detail(){var a=cur(),c=calc(a),cyc=Math.min(100,c.cd/a.days*100),ds=Object.keys(a.entries).sort().reverse(),pr=a.start+100;
 var h='<div class="bar"><button class="btn" onclick="S.sel=null;render()">← Cuentas</button><div style="flex:1;text-align:center"><div class="sub">'+esc(a.name)+'</div><b>'+esc(a.no||'sin número')+'</b></div><span class="tag '+(c.breach?'b':'a')+'">'+(c.breach?'BREACHED':'ACTIVE')+'</span></div>';
 h+='<div class="st"><div class="s"><small>Account balance</small><b>'+fmt(c.bal)+'</b></div><div class="s"><small>Minimum balance</small><b>'+fmt(c.floor)+'</b>'+(c.floor>=pr?'<div class="sub">bloqueado en '+fmt(pr)+'</div>':'')+'</div><div class="s"><small>Total P&amp;L</small><b class="'+(c.profit>=0?'g':'r')+'">'+(c.profit>0?'+':'')+fmt(c.profit)+'</b></div><div class="s"><small>Trading days</small><b>'+c.n+'</b></div><div class="s"><small>Min profit amount</small><b>'+fmt(a.minDay)+'</b></div></div>';
 h+=a.type==='eval'?evalPanel(a,c):'<div class="st"><div class="s"><small>Min profit days (ciclo)</small><b class="'+(c.cd>=a.days?'g':'r')+'">'+c.cd+'</b> <span class="sub">/ '+a.days+'</span><div class="prog"><i style="width:'+cyc+'%"></i></div></div><div class="s"><small>Disponible para retirar</small><b class="g">'+fmt(c.avail)+'</b></div><div class="s"><small>Colchón sobre mínimo</small><b>'+fmt(c.bal-c.floor)+'</b></div><div class="s"><small>Ganado / Perdido</small><b class="g">'+fmt(c.win)+'</b> <b class="r">'+fmt(c.loss)+'</b></div><div class="s"><small>Retirado</small><b>'+fmt(c.paid)+'</b></div></div>';
 h+='<div class="card">'+chart(a,c)+'</div><div class="two"><div class="card">'+cal(a)+'</div><div class="card"><h2>Registrar día</h2><div class="row"><div class="f"><label>Fecha</label><input id="ed" type="date" value="'+(S.day||today())+'"></div><div class="f"><label>P&amp;L del día ($)</label><input id="ep" type="number" step="0.01" placeholder="-120.50"></div></div><button class="btn g" style="width:100%;margin-top:8px" onclick="setE()">Guardar día</button><div class="note">Toca un día del calendario para editarlo. Un día cuenta como “día de profit” si gana al menos '+fmt(a.minDay)+'.</div>'+
